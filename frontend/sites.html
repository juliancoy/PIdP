<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIdP Clients</title>
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body data-page="sites">
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="/">PIdP</a>
            <nav class="topnav" id="topnav"></nav>
        </header>

        <main class="page">
            <section class="page-heading">
                <div>
                    <p class="eyebrow">Clients</p>
                    <h1>Your registered clients</h1>
                    <p class="lede">Inspect client metadata and open each client's user roster.</p>
                </div>
                <button class="primary-button" id="create-client-btn" type="button">Create Client</button>
            </section>

            <section class="panel" id="sites-summary"></section>

            <section class="panel">
                <div class="section-header">
                    <h2>Owned clients</h2>
                    <button class="secondary-button" id="refresh-sites" type="button">Refresh</button>
                </div>
                <div id="sites-list" class="stack"></div>
            </section>
        </main>
    </div>

    <!-- Create Client Modal -->
    <dialog id="create-client-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create Client</h2>
                <button class="modal-close" id="close-modal" type="button" aria-label="Close">&times;</button>
            </div>
            <form id="create-client-form" class="stack">
                <div class="field">
                    <label for="client-name">Name</label>
                    <input id="client-name" name="name" type="text" required>
                </div>
                <div class="field">
                    <label for="client-source-url">Source URL</label>
                    <input id="client-source-url" name="source_url" type="url" placeholder="https://your-app.com" required>
                </div>
                <div class="field">
                    <label for="client-callback">Callback URL</label>
                    <input id="client-callback" name="callback_url" type="url" placeholder="https://your-app.com/auth/callback" required>
                </div>
                <div class="field">
                    <label for="client-description">Description</label>
                    <textarea id="client-description" name="description"></textarea>
                </div>
                <div class="button-row">
                    <button class="primary-button" type="submit">Create client</button>
                    <button class="secondary-button" type="button" id="cancel-create">Cancel</button>
                    <div id="create-status"></div>
                </div>
            </form>
        </div>
    </dialog>

    <noscript>This interface requires JavaScript.</noscript>
    <script type="module" src="/assets/js/sites.js"></script>
</body>
</html>
