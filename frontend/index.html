<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIdP Console</title>
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body data-page="home">
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="/">PIdP</a>
            <nav class="topnav" id="topnav"></nav>
        </header>

        <main class="page">
            <section class="hero">
                <div>
                    <p class="eyebrow">People's Identity Provider</p>
                    <h1>Manage your identity and website users from one place.</h1>
                    <p class="lede">
                        Sign in to view your basic profile fields, inspect the websites you own,
                        and review each website's registered users.
                    </p>
                </div>
                <div class="hero-panel" id="session-card"></div>
            </section>

            <section class="grid two-up">
                <article class="panel" id="auth-panel"></article>
                <article class="panel" id="overview-panel"></article>
            </section>
        </main>
    </div>

    <noscript>This interface requires JavaScript.</noscript>
    <script type="module" src="/assets/js/home.js"></script>
</body>
</html>
