<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIdP Profile</title>
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body data-page="profile">
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="/">PIdP</a>
            <nav class="topnav" id="topnav"></nav>
        </header>

        <main class="page">
            <section class="page-heading">
                <div>
                    <p class="eyebrow">Profile</p>
                    <h1>Your basic fields</h1>
                    <p class="lede">Review and update the account information exposed through PIdP.</p>
                </div>
            </section>

            <section class="grid two-up">
                <article class="panel" id="profile-summary"></article>
                <article class="panel">
                    <form id="profile-form" class="stack"></form>
                </article>
            </section>
        </main>
    </div>

    <noscript>This interface requires JavaScript.</noscript>
    <script type="module" src="/assets/js/profile.js"></script>
</body>
</html>
