name: Check PIdP serverless authentication
on:
  push:
    paths: ['serverless/**', '.github/workflows/check-mcp-auth.yml']
  pull_request:
    paths: ['serverless/**', '.github/workflows/check-mcp-auth.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serverless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: serverless/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # No secrets, remote migrations, or deployment.
